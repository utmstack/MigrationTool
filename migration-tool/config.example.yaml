# ============================================================================
# UTMStack Migration Tool - Configuration Examples
# ============================================================================
# 
# ============================================================================

# ============================================================================
# EXAMPLE 1: UPGRADE (In-Place V11 → V12)
# ============================================================================
# 
# Option A: Local upgrade (run ON the V11 server)
#   Just run: sudo ./utmstack_migration_tool upgrade
#   No config file needed - everything is auto-detected!
#
# Option B: Remote upgrade (from your workstation)
#   Uncomment below and use: sudo ./utmstack_migration_tool upgrade --config config.yaml

# source:
#   host: "192.168.1.100"          # V11 server IP
#   ssh_user: "utmstack"           # SSH username
#   ssh_password: "your-password"  # SSH password
#   # ssh_private_key: "~/.ssh/id_rsa"  # Alternative: use SSH key

# ============================================================================
# EXAMPLE 2: MIGRATE (V11 → V12 on Different Servers)
# ============================================================================
# Usage: sudo ./utmstack_migration_tool migrate --config config.yaml

source:
  host: "192.168.1.100"            # V11 server IP
  ssh_user: "utmstack"             # SSH username
  ssh_password: "your-password"    # SSH password
  # ssh_private_key: "~/.ssh/id_rsa"  # Alternative: use SSH key
  # port: 5432                       # PostgreSQL port (default: 5432)
  # user: "postgres"                 # PostgreSQL user (default: postgres)
  # password: ""                     # PostgreSQL password (auto-detected from compose.yml if empty)
  # sslmode: "disable"               # PostgreSQL SSL mode (default: disable)
  # ssh_port: 22                     # SSH port (default: 22)

destination:
  host: "192.168.1.200"            # V12 server IP
  ssh_user: "utmstack"             # SSH username
  ssh_password: "your-password"    # SSH password
  # ssh_private_key: "~/.ssh/id_rsa"  # Alternative: use SSH key
  # port: 5432                       # PostgreSQL port (default: 5432)
  # user: "postgres"                 # PostgreSQL user (default: postgres)
  # password: ""                     # PostgreSQL password (auto-detected from compose.yml if empty)
  # sslmode: "disable"               # PostgreSQL SSL mode (default: disable)
  # ssh_port: 22                     # SSH port (default: 22)
  # Directory where V12 reads the migrated integration YAMLs
  # (default: /utmstack/events-engine-workdir/pipeline)
  # integrations_config_dir: "/utmstack/events-engine-workdir/pipeline"

# ============================================================================
# EXAMPLE 3: EXPORT ONLY
# ============================================================================
# Usage: sudo ./utmstack_migration_tool export --config config.yaml

# source:
#   host: "192.168.1.100"
#   ssh_user: "utmstack"
#   ssh_password: "your-password"

# ============================================================================
# EXAMPLE 4: IMPORT ONLY
# ============================================================================
# Usage: sudo ./utmstack_migration_tool import --config config.yaml --input backup.yml

# destination:
#   host: "192.168.1.200"
#   ssh_user: "utmstack"
#   ssh_password: "your-password"
#   # integrations_config_dir: "/utmstack/events-engine-workdir/pipeline"

# ============================================================================