name: Build migration-tool (release)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build linux/amd64 and attach to release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: migration-tool/go.mod
          cache: true
          cache-dependency-path: migration-tool/go.sum

      - name: Build binary
        working-directory: migration-tool
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          OUT="utmstack_migration_tool"
          echo "→ Building $OUT"
          go build -trimpath -ldflags="-s -w" -o "$OUT" .
          ls -lh "$OUT"

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            migration-tool/utmstack_migration_tool \
            --clobber
